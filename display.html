<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Live Emotion Display</title>
  <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #111;
      color: white;
      transition: background-color 0.4s ease;
      padding: 20px 20px 60px;
      box-sizing: border-box;
    }

    #status {
      align-self: flex-start;
      font-size: 16px;
      opacity: 0.6;
      margin-bottom: 10px;
    }

    #controls {
      margin-bottom: 30px;
    }
    #controls button {
      padding: 10px 20px;
      margin-right: 10px;
      font-size: 15px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.15);
      color: white;
    }
    #controls button:disabled {
      opacity: 0.4;
      cursor: default;
    }
    #controls button:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.25);
    }

    #emoji { font-size: 180px; line-height: 1; margin-top: 10px; }
    #label {
      font-size: 56px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 5px;
    }
    #confidence { font-size: 24px; opacity: 0.75; margin-top: 6px; }

    #transcriptBox {
      margin-top: 40px;
      width: 100%;
      max-width: 700px;
      min-height: 80px;
      padding: 16px 20px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
      font-size: 20px;
      line-height: 1.5;
    }
    #transcriptLabel {
      font-size: 15px;
      opacity: 0.55;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 40px;
      margin-bottom: 8px;
      align-self: flex-start;
      max-width: 700px;
      width: 100%;
    }

    #summary {
      margin-top: 30px;
      width: 100%;
      max-width: 700px;
      padding: 16px 20px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
      font-size: 18px;
      display: none;
    }
  </style>
</head>
<body>
  <div id="status">Not connected</div>

  <div id="controls">
    <button id="joinBtn">Join Room</button>
    <button id="muteBtn" disabled>Mute</button>
    <button id="leaveBtn" disabled>Leave</button>
  </div>

  <div id="emoji">🎙️</div>
  <div id="label">Listening</div>
  <div id="confidence"></div>

  <div id="transcriptLabel">Live Transcript</div>
  <div id="transcriptBox">(nothing yet)</div>

  <div id="summary"></div>

  <script>
    const BACKEND_URL = "https://livekit-igkx.onrender.com";

    const COLORS = {
      angry:    "#5c1a1a",
      disgust:  "#1a4d2e",
      fear:     "#3a1a5c",
      happy:    "#5c4a1a",
      neutral:  "#1a3a5c",
      sad:      "#1a2a5c",
      surprise: "#5c531a",
    };

    let room = null;
    let micTrack = null;
    let isMuted = false;
    let recognition = null;
    let pollTimer = null;

    // --- live emotion display (polls the backend) ---
    async function poll() {
      try {
        const res = await fetch(`${BACKEND_URL}/status?t=${Date.now()}`);
        if (!res.ok) throw new Error("not ready");
        const data = await res.json();

        document.getElementById("emoji").textContent = data.emoji || "🎙️";
        document.getElementById("label").textContent = data.label || "listening";
        document.getElementById("confidence").textContent =
          data.confidence != null ? Math.round(data.confidence * 100) + "% of recent readings agree" : "";
        document.body.style.backgroundColor = COLORS[data.label] || "#111";
        document.getElementById("status").textContent = "Live";
      } catch (e) {
        document.getElementById("status").textContent = "Waiting for audio…";
      }
    }

    // --- audio to text (built into Chrome) ---
    function setupSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        document.getElementById("transcriptBox").textContent =
          "Speech-to-text isn't supported in this browser. Try Chrome.";
        return null;
      }
      const rec = new SpeechRecognition();
      rec.continuous = true;
      rec.interimResults = true;
      rec.lang = "en-US";

      rec.onresult = (event) => {
        let finalText = "";
        let interimText = "";
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const piece = event.results[i][0].transcript;
          if (event.results[i].isFinal) finalText += piece + " ";
          else interimText += piece;
        }
        const box = document.getElementById("transcriptBox");
        if (finalText) {
          box.dataset.final = (box.dataset.final || "") + finalText;
        }
        box.textContent = (box.dataset.final || "") + interimText;
      };

      rec.onerror = (e) => console.warn("Speech recognition error:", e.error);
      rec.onend = () => {
        if (room) {
          try { rec.start(); } catch (e) {}
        }
      };

      return rec;
    }

    async function fetchWithWakeUp(url, options, attempt = 1) {
      // The free backend can go to sleep after inactivity. First request
      // wakes it up, which can take up to ~50 seconds. Retry a few times
      // with a friendly message instead of just failing.
      try {
        const res = await fetch(url, options);
        if (!res.ok) throw new Error("bad response");
        return res;
      } catch (e) {
        if (attempt >= 6) throw e; // ~60s of retrying, then give up
        document.getElementById("status").textContent =
          "Waking up the server — this can take up to a minute on the first visit...";
        await new Promise(r => setTimeout(r, 10000));
        return fetchWithWakeUp(url, options, attempt + 1);
      }
    }

    async function joinRoom() {
      document.getElementById("joinBtn").disabled = true;
      document.getElementById("status").textContent = "Connecting...";

      try {
        await fetchWithWakeUp(`${BACKEND_URL}/reset`, { method: "POST" });
      } catch (e) {}

      const identity = "guest-" + Math.floor(Math.random() * 10000);
      let token, url;
      try {
        const res = await fetchWithWakeUp(`${BACKEND_URL}/token?identity=${identity}`);
        ({ token, url } = await res.json());
      } catch (e) {
        document.getElementById("status").textContent =
          "Couldn't reach the server. Please try again in a minute.";
        document.getElementById("joinBtn").disabled = false;
        return;
      }

      room = new LivekitClient.Room();
      await room.connect(url, token);

      const localTracks = await LivekitClient.createLocalTracks({ audio: true });
      micTrack = localTracks[0];
      await room.localParticipant.publishTrack(micTrack);

      document.getElementById("joinBtn").disabled = true;
      document.getElementById("muteBtn").disabled = false;
      document.getElementById("leaveBtn").disabled = false;
      document.getElementById("summary").style.display = "none";
      document.getElementById("transcriptBox").textContent = "";
      document.getElementById("transcriptBox").dataset.final = "";
      document.getElementById("status").textContent = "Connected — listening...";

      recognition = setupSpeechRecognition();
      if (recognition) recognition.start();

      poll();
      pollTimer = setInterval(poll, 700);
    }

    function toggleMute() {
      if (!micTrack) return;
      isMuted = !isMuted;
      if (isMuted) {
        micTrack.mute();
        document.getElementById("muteBtn").textContent = "Unmute";
      } else {
        micTrack.unmute();
        document.getElementById("muteBtn").textContent = "Mute";
      }
    }

    async function leaveRoom() {
      if (recognition) {
        recognition.onend = null;
        recognition.stop();
      }
      if (room) {
        await room.disconnect();
        room = null;
      }
      if (pollTimer) {
        clearInterval(pollTimer);
        pollTimer = null;
      }

      document.getElementById("status").textContent = "Not connected";
      document.getElementById("joinBtn").disabled = false;
      document.getElementById("muteBtn").disabled = true;
      document.getElementById("leaveBtn").disabled = true;

      try {
        const res = await fetch(`${BACKEND_URL}/summary`);
        const data = await res.json();
        const summaryDiv = document.getElementById("summary");
        if (!data.total) {
          summaryDiv.style.display = "none";
        } else {
          const lines = Object.entries(data.counts)
            .sort((a, b) => b[1] - a[1])
            .map(([label, pct]) => `${label}: ${pct}%`)
            .join("<br>");
          summaryDiv.innerHTML = `<strong>Session Summary</strong><br>${lines}`;
          summaryDiv.style.display = "block";
        }
      } catch (e) {
        console.warn("Could not load session summary:", e);
      }
    }

    document.getElementById("joinBtn").onclick = joinRoom;
    document.getElementById("muteBtn").onclick = toggleMute;
    document.getElementById("leaveBtn").onclick = leaveRoom;
  </script>
</body>
</html>
